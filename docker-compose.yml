services:
  app:
    build: .
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 3000
    ports:
      - "3000:3000"
    volumes:
      - instamosaic-data:/app/storage
    command: ["npm", "run", "start"]
    restart: always
    init: true
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  worker:
    build: .
    env_file:
      - .env
    environment:
      NODE_ENV: production
    volumes:
      - instamosaic-data:/app/storage
    command: ["npm", "run", "worker"]
    restart: always
    init: true
    depends_on:
      app:
        condition: service_healthy

volumes:
  instamosaic-data:
