services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: instamosaic
      POSTGRES_PASSWORD: instamosaic
      POSTGRES_DB: instamosaic
    ports:
      - "5432:5432"
    volumes:
      - instamosaic-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U instamosaic -d instamosaic"]
      interval: 10s
      timeout: 5s
      retries: 5

  worker:
    build: .
    env_file:
      - .env
    environment:
      NODE_ENV: development
      PORT: 8080
      DATABASE_URL: postgresql://instamosaic:instamosaic@postgres:5432/instamosaic?schema=public
      DIRECT_URL: postgresql://instamosaic:instamosaic@postgres:5432/instamosaic?schema=public
      LOCAL_OBJECT_STORAGE_DIR: /tmp/instamosaic-object-storage
    ports:
      - "8080:8080"
    command: ["npm", "run", "worker:http"]
    restart: unless-stopped
    init: true
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  instamosaic-postgres:
