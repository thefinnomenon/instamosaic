services:
  app:
    build: .
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 3000
    ports:
      - "3000:3000"
    volumes:
      - instamosaic-data:/app/storage
    command: ["npm", "run", "start"]
    restart: unless-stopped

  worker:
    build: .
    env_file:
      - .env
    environment:
      NODE_ENV: production
    volumes:
      - instamosaic-data:/app/storage
    command: ["npm", "run", "worker"]
    restart: unless-stopped
    depends_on:
      - app

volumes:
  instamosaic-data:
